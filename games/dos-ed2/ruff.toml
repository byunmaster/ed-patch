# 리버싱 도구 스크립트 기준 설정
line-length = 100
target-version = "py312"

[lint]
# 기본(E4/E7/E9/F) + import 정렬 + 업그레이드 힌트 + 버그베어(미사용 루프변수·zip strict 등)
extend-select = ["I", "UP", "B"]
# 리버싱 스크립트 특성상 허용: 한 글자 변수, 매직 넘버 성격의 오프셋 상수
ignore = [
  "E741",   # l, O 같은 모호한 변수명 (헥스 작업에서 관용적)
  "SIM115", # 일회성 CLI 도구에서 open().read() 관용 허용
  "SIM113", # enumerate 강제 안 함 (수동 인덱스가 더 읽기 쉬운 경우)
  "RUF059", # 언팩 시 미사용 변수 (구조체 필드 문서화 목적)
  "C408",   # dict() 리터럴 허용
  "EXE001", # 셰뱅 있으나 실행비트 없음 (도구는 python으로 호출)
]
