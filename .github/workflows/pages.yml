# 배포 사이트 — patcher/site 를 굽고, 릴리스에 붙은 패치 파일을 옆에 놓아 GitHub Pages 로 낸다.
#
# 🔴 **패치 파일(.bps/.xdelta)은 git 에 없다.** 게임 빌드 산출물(work/dist)이라 마스터가 릴리스
#   (`<게임>-<트랙>-v<버전>`)에 첨부하고, 이 워크플로가 서버 쪽에서 받아 페이지 옆에 둔다 — 웹 패치가
#   같은 출처에서 읽으니 교차 출처 제한도 없다. 어느 파일을 받을지는 site.json 의 `release` 가 정한다.
# ⚠ 게임 빌드는 여기서 안 한다(원본이 없다). 사이트를 굽고 파일을 모을 뿐이다.
# ⚠ 비공개 레포에선 돌지 않는다(Pages 가 유료) — 공개 전환 뒤 Settings → Pages → Source 를
#   「GitHub Actions」로 바꾸면 켜진다.
name: pages

on:
  push:
    branches: [main]
    paths: ["patcher/**", "shared/fonts/**", "games/*/patches/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r patcher/requirements.txt
      - run: sh scripts/fetch_galmuri.sh
      - name: 커버(타이틀 화면) 받기 — 릴리스 site-covers 의 PNG, 없으면 건너뜀
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download site-covers -R "$GITHUB_REPOSITORY" -p '*.png' -D covers || true
      - run: SITE_COVERS=covers python patcher/site/build_site.py --out _site
      - name: 릴리스 첨부 패치 받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > releases.txt
          import json
          site = json.load(open("patcher/site/site.json", encoding="utf-8"))
          for g in site["games"]:
              r = g.get("release") or {}
              if not r.get("version"):
                  continue
              tag = f"{g['id']}-{g['track']}-v{r['version']}"
              for f in (r.get("bps"), r.get("xdelta")):
                  if f:
                      print(tag, g["id"], f)
          PY
          while read -r tag dir file; do
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "$file" -D "_site/$dir" --clobber
          done < releases.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
